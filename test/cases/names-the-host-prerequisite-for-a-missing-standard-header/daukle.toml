schema = 1
project = "example/app"
version = "1.0.0"

[modules]

[plugins]
c = "./plugins/c"

[toolchains.c]
version = "21"
sources = ["src/main.c"]
output = "hello"
# A runner has a libc, so the condition a bare host arrives at is arranged
# rather than waited for: this hides the platform's headers and leaves the
# archive's own builtin ones, which is exactly what a missing libc looks like.
compileArgs = ["-nostdlibinc"]
